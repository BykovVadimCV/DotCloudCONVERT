# Синтетика «как у заказчика»: BLK360 по измерениям (blk360_measured.yaml) + беспорядок новостройки.
# Тепловая карта и вход сети на такой синтетике похожи на реальные: радиаторы и подоконники у
# окон, короба и стояки, строительный мусор, шторы, открытые полотна, неровная штукатурка,
# скользящие углы от частых стоянок. Смешанные точки - только моделью пятна луча (beam_model,
# порог эха 1,4 м по измерениям); эвристику mixed_pixels не включать: без ограничения длины она
# тянет точки от кромки до дальней стены через всю комнату.
#
#   python -m simscan generate --config configs/customer_like.yaml --count 100 --out out
layout: {}
scanner:
  angular_step_deg: 0.1          # 0,0667 у BLK360; 0,1 - быстрее, плотность в растре 2 см та же
  elevation_min_deg: -60.0
  elevation_max_deg: 90.0
  min_range_m: 0.4
  max_range_m: 60.0
  height_m: [1.10, 1.15]
  tilt_sigma_deg: 0.05
  stations_per_m2: 0.17          # у заказчика 14 стоянок на ~80 м2
  max_stations_per_room: 4
effects:
  range_sigma_mm: [0.35, 0.45]
  range_sigma_per_m_mm: [0.0, 0.015]
  incidence_noise_power: 1.0
  beam_divergence_mrad: [0.50, 0.60]
  beam_exit_mm: 1.1
  noise_cap_x_base: 40.0
  grazing_start_deg: 82.0
  echo_separation_m: 1.4
  mixed_pixels: false
  people: false
  registration_sigma_mm: [2.0, 6.0]   # толщина линии стены 4,4 см у заказчика против 3,7 при (1, 4)
interior:
  mess: [0.5, 1.0]
  furniture_per_m2: 0.04         # сверка calib-real: мебели у заказчика мало (precision низа 0,87)
  p_wardrobe_to_ceiling: 0.6     # что есть - чаще под потолок: вертикальный беспорядок вверху
  radiators: true
  p_soffit: 0.7
  p_pilaster: 0.4
  p_risers: 0.9
realism:
  wall_unevenness_mm: [6.0, 14.0]   # также неровность пола: 14 мм у заказчика
  lean_mm_per_m: [0.0, 5.0]
  shear_deg_sigma: 1.0
export:
  preview: false
